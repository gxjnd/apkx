            transform: translateY(-10px) scale(0.95);

// html-tag-js@1.1.41 - 可读版（单个函数 + 扩展）
function tag(element, props = {}) {
// 如果第二个参数是字符串，自动转为 innerHTML
if (typeof props === "string") {
props = { innerHTML: props };
}

// 支持函数组件（高级用法）
if (typeof element === "function") {
return element(props, arguments[2]);
}

// 如果传入已有 DOM 节点，直接返回
if (element instanceof Node) {
return element;
}

// 必须是字符串标签名
if (typeof element !== "string") {
throw new Error(`Invalid tag: ${typeof element}`);
}

const el = document.createElement(element);

// 处理属性
Object.keys(props).forEach(key => {
let value = props[key];
if (value === undefined) return;

switch (key) {
case "child":
appendChild(el, value);
break;

case "children":
if (!Array.isArray(value)) {
throw new Error("children must be an array of Nodes");
}
value.flat().forEach(child => appendChild(el, child));
break;

case "attr":
Object.keys(value).forEach(attrKey => {
const attrVal = value[attrKey];
if (attrVal !== undefined) el.setAttribute(attrKey, attrVal);
});
break;

case "style":
case "dataset":
Object.keys(value).forEach(subKey => {
const subVal = value[subKey];
if (subVal !== undefined) el[key][subKey] = subVal;
});
break;

case "ref":
if (value && value.instanceOfRef) value.el = el;
break;

default:
el[key] = value;
}
});

return el;
}

// 辅助函数：追加子节点（支持字符串自动转文本）
function appendChild(parent, child) {
if (!(child instanceof Node)) {
child = document.createTextNode(String(child));
}
// 支持响应式文本节点（tag.use）的 clone
if (child instanceof Text && typeof child.clone === "function") {
child = child.clone();
}
parent.append(child);
}

// === 内置扩展方法（与官方完全一致）===
Object.defineProperties(tag, {
get: {
value: selector => document.querySelector(selector)
},
getAll: {
value: selector => Array.from(document.querySelectorAll(selector))
},
parse: {
value: html => {
const div = document.createElement("div");
div.innerHTML = html;
return div.childElementCount === 1
? div.firstElementChild
: Array.from(div.children);
}
},
text: {
value: str => document.createTextNode(str)
},
use: {
value: (initial = "") => {
let value = initial;
let isCloned = false;
const node = document.createTextNode(initial);
const clones = [node];

Object.defineProperty(node, "value", {
set: v => {
value = v;
clones.forEach(c => (c.textContent = v));
},
get: () => value
});

Object.defineProperty(node, "clone", {
value: () => {
if (!isCloned) {
isCloned = true;
return node;
}
const clone = node.cloneNode();
clones.push(clone);
return clone;
}
});

return node;
}
}
});

// 自动全局暴露（浏览器环境）
if (typeof window !== "undefined" && !window.tag) {
window.tag = tag;
}

function showToast(message, duration = 500, type = 'info') {
  // 1. Create the toast container if it doesn't exist yet
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    // Style container to stack in the bottom-right corner
    Object.assign(container.style, {
      position: 'fixed',
      top: '20px',
      right: '20px',
      zIndex: '99999999',
      display: 'flex',
      flexDirection: 'column',
      gap: '10px'
    });
    document.body.appendChild(container);
  }

  // 2. Create the toast element
  const toast = document.createElement('div');
  toast.textContent = message;

  // Background colors based on notification type
  const bgColors = {
    info: '#3182ce',
    success: '#38a169',
    error: '#e53e3e',
    warning: '#dd6b20'
  };

  // Base styles
  Object.assign(toast.style, {
    backgroundColor: bgColors[type] || bgColors.info,
    color: '#ffffff',
    padding: '12px 20px',
    borderRadius: '6px',
    boxShadow: '0 4px 6px rgba(0, 0, 0, 0.1)',
    fontSize: '14px',
    fontFamily: 'sans-serif',
    opacity: '0',
    transform: 'translateY(20px)',
    transition: 'all 0.3s ease'
  });

  container.appendChild(toast);

  // 3. Trigger entry animation (next frame)
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateY(0)';
  });

  // 4. Handle removal after duration
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(20px)';
    
    // Remove element after transition finishes
    toast.addEventListener('transitionend', () => toast.remove());
  }, duration);
}

          // 1. 如果当前有打开的连接，必须先关闭，否则删除操作会一直 pending

              return null; // 或者返回一个默认值

    // 确保所有项都有初始 position (防止旧数据干扰)
    list.forEach((item, i) => {
        if (item.position === undefined) item.position = (i + 1) * 1000;
    });
  
    const movingItem = list.find(item => item.id === itemId);
  //  alert(itemId+","+targetIndex)
    if (!movingItem) return;
 // alert("1")
    // 2. 排除掉当前移动项后的参考列表
    //
    const refList = list.filter(item => item.id !== itemId);
  
    let newPos;
    if (targetIndex <= 0) {
        // 移到开头：第一个元素位置的一半
        newPos = refList.length > 0 ? parseFloat(refList[0].position) / 2 : 1000;
    } else if (targetIndex >= refList.length) {
        // 移到末尾：最后一个元素位置 + 1000
        newPos = parseFloat(refList[refList.length - 1].position) + 1000;
    } else {
        // 移到中间：(前一个 + 后一个) / 2
        const prev = parseFloat(refList[targetIndex - 1].position);
        const next = parseFloat(refList[targetIndex].position);
        //alert(prev+","+next)
        newPos = (prev + next) / 2;
    
      
    }
  
    // 3. 更新到数据库
    movingItem.position = newPos;
    //alert(JSON.stringify(newPos))
    //return 
    const transaction = this.db.transaction([storeName], "readwrite");
    transaction.objectStore(storeName).put(movingItem);
  
    return new Promise((resolve) => {
      transaction.oncomplete = () => resolve(newPos);
       // transaction.oncomplete = () => resolve(true);
    });
  }

  async updateAll(storeName, dataArray) {
      if (!this.db) throw new Error("数据库未连接");
      
      // 1. 开启读写事务
      const transaction = this.db.transaction([storeName], "readwrite");
      const store = transaction.objectStore(storeName);
  
      return new Promise((resolve, reject) => {
          // 2. 整个事务成功的回调
          transaction.oncomplete = () => {
              resolve({ success: true, count: dataArray.length });
          };
  
          // 3. 整个事务失败的回调（任何一个 put 失败都会触发）
          transaction.onerror = (e) => {
              reject(e.target.error);
          };
  
          // 4. 循环执行 put 操作
          // 注意：put 是异步发出的，但它们会按顺序排队进入事务队列
          for (const item of dataArray) {
              try {
                  store.put(item);
              } catch (err) {
                  // 处理无效数据导致的同步错误（如 DataError）
                  reject(err);
                  break;
              }
          }
      });
  }

  });

  // 按 position 升序排序
  list.sort((a, b) => a.position - b.position);

  let newPos;

  if (afterId === null || afterId === undefined) {
    // 插到最前面
    newPos = list.length > 0 ? list[0].position / 2 : 1000;
  } else {
    // 找到 afterId 对应的项
    const afterIndex = list.findIndex(item => item.id === afterId);
    if (afterIndex === -1) {
      // 找不到 afterId，就当作插到最后
      newPos = list.length > 0
        ? list[list.length - 1].position + 1000
        : 1000;
    } else if (afterIndex === list.length - 1) {
      // afterId 是最后一项 → 插到末尾
      newPos = list[afterIndex].position + 1000;
    } else {
      // 中间：取 afterId 和下一项的中间值
      const prevPos = list[afterIndex].position;
      const nextPos = list[afterIndex + 1].position;
      newPos = (prevPos + nextPos) / 2;
    }
  }

  // 给新数据赋值 position
  newItem.position = newPos;

  // 写入数据库
  const transaction = this.db.transaction([storeName], "readwrite");
  transaction.objectStore(storeName).put(newItem);   // 或 .add(newItem)

  return new Promise(resolve => {
    transaction.oncomplete = () => resolve(newPos);
    transaction.onerror = () => resolve(null);
  });
}
//---------------------------------------------------------------------------------
async deleteItem(storeName, itemId) {
  return new Promise((resolve, reject) => {
    const transaction = this.db.transaction([storeName], "readwrite");
    const store = transaction.objectStore(storeName);

    // 1. 先查询确认数据是否存在（可选，但更严谨）
    const getRequest = store.get(itemId);

    getRequest.onsuccess = () => {
      const item = getRequest.result;
      if (!item) {
        reject(new Error(`未找到 ID 为 ${itemId} 的数据`));
        return;
      }

      // 2. 执行删除
      const deleteRequest = store.delete(itemId);

      deleteRequest.onsuccess = () => {
        resolve(true);
      };

      deleteRequest.onerror = (err) => {
        reject(new Error("删除失败: " + err.target.error));
      };
    };

    getRequest.onerror = (err) => {
      reject(new Error("查询失败: " + err.target.error));
    };
  });
}

}

function renderArtDateTime(rawString) {
    // 1. Parse string
    const [date, time] = rawString.split(' ');
    
    if (!date || !time) {
        console.warn('字符串格式不正确，需要包含空格');
        return '';
    }

    // 2. Extract year and month/day (handles both YYYY/MM/DD and YYYY-MM-DD)
    const dateParts = date.split(/[\/\.-]/);
    const year = dateParts[0];
    const monthDay = dateParts.slice(1).join('.'); // e.g., "04.17"

    // 3. Build HTML template with data-year
    const htmlTemplate = `
<div class="datetime-div" data-year="${year}">
    <span class="date-text">${monthDay}</span>
    <span class="time-text">${time}</span>
</div>`;

    return htmlTemplate;
}

function generateFilename() {
    const now = new Date();
    const day = now.getDate();
    const timestamp = Math.floor(now.getTime() / 1000);
    const randomNumber = Math.floor(Math.random() * 10);

    return `${day}-${timestamp}-${randomNumber}`;
}

function downloadDataInBrowser(dataz) {
    // 1. 自动处理数据格式（如果是对象则序列化）
    const content = typeof dataz === 'object' ? JSON.stringify(dataz, null, 2) : String(dataz);
    
    // 2. 生成文件名
    const filename = `${generateFilename()}.json`;

    // 3. 创建 Blob 数据块 (指定类型为 json)
    const blob = new Blob([content], { type: 'application/json;charset=utf-8;' });
    
    // 4. 创建内存临时 URL
    const url = URL.createObjectURL(blob);

    // 5. 动态创建 <a> 标签并模拟点击触发下载
    const link = document.createElement('a');
    link.href = url;
    link.download = filename; // 设置下载文件名
    
    document.body.appendChild(link);
    link.click();

    // 6. 清理 DOM 与释放内存
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

function sendLongString(dataz) {
    //alert(9)
    // 获取长字符串
   // const content = document.getElementById('longText').value;
  //dataz="67"
    // 检查 Cordova 环境
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.cordova_iab) {
        
        // 建议：封装成对象
        const payload = {
            type: "DATA_TRANSFER",
            payload: dataz, // 这里的 content 可以是非常长的字符串
            timestamp: Date.now()
        };
   // alert(2)
        // 发送给 Cordova
        // 注意：必须使用 JSON.stringify 转化为字符串发送
        window.webkit.messageHandlers.cordova_iab.postMessage(JSON.stringify(payload));
        //alert()
      //  console.log("已发送长度为 " + content.length + " 的字符串");
    } else {
      downloadDataInBrowser(dataz)
        showToast("非 Cordova 环境,没有安装ef");
    }
}

const isWebView = () => {
  const ua = window.navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIos = /iPhone|iPad|iPod/i.test(ua);

  if (isAndroid) {
    // Android WebView 通常包含 "wv"
    return /wv/i.test(ua) || /Version\/[\d.]+/i.test(ua);
  }
  
  if (isIos) {
    // iOS WebView 的特征是不包含 "Safari" 关键字，但包含 "AppleWebKit"
    return /AppleWebKit/i.test(ua) && !/Safari/i.test(ua);
  }

  return false;
};
